<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Управление финансами</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <nav class="menu">
          <button class="burger-menu">☰</button>
          <ul class="nav-list">
            <li class="menu-link active" data-tab="content-all">Общее</li>
            <li class="menu-link" data-tab="content-income">Доходы</li>
            <li class="menu-link" data-tab="content-expenses">Расходы</li>
            <li class="menu-link" data-tab="content-analytic">Аналитика</li>
          </ul>
        </nav>
      </header>
      <main class="main">
        <!-- Общий список -->
        <div class="tab-content active" id="content-all">
          <h2 class="title-h2">Список доходов и расходов</h2>
          <div class="menu-all">
            <input type="text" class="search-all" placeholder="Поиск..." />
            <select class="filter-category">
              <option value="all">Все категории</option>
              <option value="food">Еда</option>
              <option value="transport">Транспорт</option>
              <option value="entertainment">Развлечения</option>
            </select>
            <button class="btn-add">+ Добавить</button>
          </div>
          <table class="records-table">
            <thead>
              <tr>
                <th>Сумма</th>
                <th>Категория</th>
                <th>Дата</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody>
              <!-- Записи будут добавляться сюда -->
            </tbody>
          </table>
        </div>

        <!-- Доходы -->
        <div class="tab-content" id="content-income">
          <h2 class="title-h2">Список доходов</h2>
          <div class="menu-all">
            <input type="text" class="search-all" placeholder="Поиск..." />
            <button class="btn-add">+ Добавить</button>
          </div>
          <table class="records-table">
            <thead>
              <tr>
                <th>Сумма</th>
                <th>Категория</th>
                <th>Дата</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody>
              <!-- Записи будут добавляться сюда -->
            </tbody>
          </table>
        </div>

        <!-- Расходы -->
        <div class="tab-content" id="content-expenses">
          <h2 class="title-h2">Список расходов</h2>
          <div class="menu-all">
            <input type="text" class="search-all" placeholder="Поиск..." />
            <button class="btn-add">+ Добавить</button>
          </div>
          <table class="records-table">
            <thead>
              <tr>
                <th>Сумма</th>
                <th>Категория</th>
                <th>Дата</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody>
              <!-- Записи будут добавляться сюда -->
            </tbody>
          </table>
        </div>

        <!-- Аналитика -->
        <div class="tab-content" id="content-analytic">
          <h2 class="title-h2">Аналитика</h2>
          <div class="analytics-container">
          </div>
        </div>
      </main>

      <!-- Модальное окно для добавления записи -->
 <div class="modal" id="modal">
  <div class="modal-content">
    <span class="close-button">&times;</span>
    <form id="record-form">
<div class="radio">
  <label for="income"><input type="radio" name="choice" id="income" value="Доход" checked> Доход</label>
  <label for="expenses"><input type="radio" name="choice" id="expense" value="Расход"> Расход</label>
</div>
      <label for="amount">Сумма:</label>
      <input type="text" id="amount" placeholder="1 000 ₽">
      <label for="category">Категория:</label>
      <select id="category">
        <option value="food">Еда</option>
        <option value="transport">Транспорт</option>
        <option value="entertainment">Развлечения</option>
      </select>
      <label for="date">Дата:</label>
      <input type="date" id="date" placeholder="02/02/2025">
      <label for="description">Описание:</label>
      <textarea id="description"></textarea>
      <button type="submit">ОК</button>
    </form>
  </div>
 </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
